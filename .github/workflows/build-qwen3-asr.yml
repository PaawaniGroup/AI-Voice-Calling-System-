name: build-qwen3-asr-image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: "Push image to Docker Hub (requires DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets)"
        type: boolean
        default: false
  push:
    branches: ["feature/qwen3-asr-worker"]
    paths: ["mme-qwen3-asr-runpod/**", ".github/workflows/build-qwen3-asr.yml"]

permissions:
  contents: read

env:
  IMAGE: mmeog/mme-qwen3-asr
  VERSION: 1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (CPU, mocked model)
        working-directory: mme-qwen3-asr-runpod
        run: |
          python -m pip install numpy scipy PyYAML pytest
          python -m pytest tests -q -c /dev/null --rootdir .
      - name: Secret scan of build context
        run: |
          if grep -rEIl --exclude-dir=__pycache__ '(hf_[A-Za-z0-9]{20,}|rpa_[A-Za-z0-9]{20,}|ghp_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16})' mme-qwen3-asr-runpod; then
            echo "possible secret in build context"; exit 1; fi
      - uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        if: ${{ github.event.inputs.push_image == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and push only when requested)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: mme-qwen3-asr-runpod
          platforms: linux/amd64
          push: ${{ github.event.inputs.push_image == 'true' }}
          tags: ${{ env.IMAGE }}:${{ env.VERSION }}
      - name: Record digest
        if: ${{ github.event.inputs.push_image == 'true' }}
        run: echo "digest=${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
